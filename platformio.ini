; Lootr Loot-o-mo-tron — PlatformIO configuration
; Target: Teensy 4.0

[env:teensy40]
platform  = teensy
board     = teensy40
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Libraries (Teensy Audio Library is bundled with Teensyduino)
lib_deps =
    PaulStoffregen/SerialFlash   ; SPI flash access + AudioPlaySerialflashRaw
    thomasfredericks/Bounce2     ; Trigger button debouncing

build_flags =
    -std=c++17
