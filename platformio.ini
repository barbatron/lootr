; Lootr Loot-o-mo-tron — PlatformIO configuration
; Target: Teensy 4.0

[teensy40_base]
platform      = teensy
board         = teensy40
framework     = arduino
monitor_speed = 115200
build_flags   = -std=c++17

; ── Production build (SD card) ──────────────────────────────────────────────
; Flash with: pio run -e teensy40 --target upload
[env:teensy40]
extends  = teensy40_base
; Libraries (SD, Teensy Audio bundled with Teensyduino)
lib_deps =
    thomasfredericks/Bounce2     ; Trigger button debouncing

; ── Hardware test build (LittleFS + MTP, no SD card required) ───────────────
; Assets transferred over USB via MTP (Teensy mounts as "Lootr Test" drive).
; Flash with: pio run -e teensy40_hwtest --target upload
;
; Asset prep: ./scripts/prepare_assets_hw_test.sh
;   Default: 44100 Hz, 2 files/category → ~8 files, ~300 KB — fits in 1 MB flash
;   Smaller: --rate 22050 → half size; update AUDIO_SAMPLE_RATE_EXACT in main_hw_test.cpp
[env:teensy40_hwtest]
extends = teensy40_base
lib_deps =
    thomasfredericks/Bounce2     ; Trigger button debouncing
    ; LittleFS and MTP_Teensy are bundled with Teensyduino 1.57+
    ; If your Teensyduino is older, add: https://github.com/PaulStoffregen/MTP_Teensy
build_src_filter =
    -<main.cpp>
    +<main_hw_test.cpp>
