; Lootr Loot-o-mo-tron — PlatformIO configuration
; Target: Teensy 4.0

[env:teensy40]
platform  = teensy
board     = teensy40
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Libraries (Teensy Audio Library and SD are bundled with Teensyduino)
lib_deps =
    thomasfredericks/Bounce2     ; Trigger button debouncing

build_flags =
    -std=c++17
