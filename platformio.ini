; Lootr PlatformIO configuration (Raspberry Pi Pico + Arduino)

[platformio]
default_envs = pico_lootr_integration

[env:pico_lootr_integration]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; cu.usbmodem103* / cu.usbmodem104* can vary by reconnect/reset:
; wildcard keeps monitor selection stable on macOS.
monitor_port = /dev/cu.usbmodem*

lib_extra_dirs =
    ${platformio.packages_dir}/framework-arduinopico/libraries

lib_deps =
    SD
    I2S
    https://github.com/pschatzmann/arduino-audio-tools.git

; Build flags for optimization and debugging
build_unflags = -g3
build_flags = -O2

lib_ldf_mode = chain
