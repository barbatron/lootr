; Lootr Loot-o-mo-tron — PlatformIO configuration
; Target: Teensy 4.0

[teensy40_base]
platform      = teensy
board         = teensy40
framework     = arduino
monitor_speed = 115200
build_flags   = -std=c++17

; ── Production build (SD card) ──────────────────────────────────────────────
; Flash with: pio run -e teensy40 --target upload
[env:teensy40]
extends  = teensy40_base
; Libraries (SD, Teensy Audio bundled with Teensyduino)
lib_deps =
    thomasfredericks/Bounce2     ; Trigger button debouncing
build_src_filter =
    +<main.cpp>
    -<main_hw_test.cpp>

; ── Final embedded variant (SD assets + onboard analog audio) ─────────────
; This is the shipping path for LM386 speaker output.
[env:teensy40_final_embedded]
extends = teensy40_base
lib_deps =
    thomasfredericks/Bounce2
build_src_filter =
    +<main.cpp>
    -<main_hw_test.cpp>

; ── Hardware test build (LittleFS + MTP, no SD card required) ───────────────
; STEP 1: Load .raw files onto Teensy internal flash via USB drag-and-drop.
;   1. ./scripts/prepare_assets_hw_test.sh
;   2. pio run -e teensy40_hwtest --target upload
;   3. Teensy mounts as "Lootr Test" in Finder — drag *.raw files onto it
;   4. Eject the drive
[env:teensy40_hwtest]
extends = teensy40_base
build_flags =
    -std=c++17
    -DUSB_MTPDISK_SERIAL  ; Teensy USB type: exposes serial + MTP drive to macOS
                          ; This activates the MTP implementation bundled in Teensyduino
lib_deps =
    thomasfredericks/Bounce2
build_src_filter =
    -<main.cpp>
    +<main_hw_test.cpp>

; ── Hardware test build (LittleFS + USB Audio output) ───────────────────────
; STEP 2: After loading files with teensy40_hwtest, reflash this for playback.
;   Files on LittleFS survive reflashing.
;   1. pio run -e teensy40_hwtest_usbaudio --target upload
;   2. macOS System Settings > Sound > Output > "Teensy USB Audio"
;   3. Use joystick — audio plays through Mac speakers/headphones
[env:teensy40_hwtest_usbaudio]
extends = teensy40_base
build_flags =
    -std=c++17
    -DUSB_MIDI_AUDIO_SERIAL  ; Teensy USB type: serial + MIDI + audio (no USB_SERIAL_AUDIO in this Teensyduino)
    -DUSB_AUDIO_OUT           ; Switch main_hw_test.cpp to AudioOutputUSB
lib_deps =
    thomasfredericks/Bounce2
build_src_filter =
    -<main.cpp>
    +<main_hw_test.cpp>

; ── Local iteration variant (internal LittleFS assets + USB audio) ─────────
; Limited asset set in internal flash. No SD card required.
[env:teensy40_local_usb]
extends = teensy40_base
build_flags =
    -std=c++17
    -DUSB_MIDI_AUDIO_SERIAL
    -DUSB_AUDIO_OUT
lib_deps =
    thomasfredericks/Bounce2
build_src_filter =
    -<main.cpp>
    +<main_hw_test.cpp>

; ── SD asset variant (SD-backed assets + USB audio) ────────────────────────
; Uses production SD asset loading but routes output over USB audio.
[env:teensy40_sd_usb]
extends = teensy40_base
build_flags =
    -std=c++17
    -DUSB_MIDI_AUDIO_SERIAL
    -DUSB_AUDIO_OUT
lib_deps =
    thomasfredericks/Bounce2
build_src_filter =
    +<main.cpp>
    -<main_hw_test.cpp>
