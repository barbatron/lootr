; Lootr PlatformIO configuration (Raspberry Pi Pico + Arduino)

[platformio]
default_envs = pico_lootr_integration
src_dir = raspberry_pi_pico_lootr_integration

[env:pico_lootr_integration]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200

; cu.usbmodem103* / cu.usbmodem104* can vary by reconnect/reset:
; wildcard keeps monitor selection stable on macOS.
monitor_port = /dev/cu.usbmodem*

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
